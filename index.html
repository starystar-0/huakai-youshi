const STORY={
C01:N('C01','雨停以前','seed','ying',[
L('旁白','先是一道缝。然后，光进来了。'),L('我','我把第一片叶子探出去。风一碰，它便抖了一下。'),L('旁白','我落在巴中的一条小径边，刚从一粒无名草籽长成幼芽。还没有名字，也不知道将来会开什么花。'),L('我','一滴雨水压在叶尖。旁边那株更小的芽，却还够不到湿润的土。')
],'先试着做一件什么事？',[
O('用力撑起叶片',{D:2,last:'D',stood:true},L('旁白','叶尖颤了两次，终于托起水珠。水滴落下时，我也向后晃了晃。'),L('映红','力气不大，倒挺肯试。下次记得先找稳支点。')),
O('把水珠引向身旁的小芽',{L:2,last:'L',watered:true},L('旁白','我低下叶尖。水沿着细细的叶脉，落到小芽脚边。'),L('兰序','它的叶子舒展开了。你自己也别一直低着头。')),
O('先看看水珠怎样流动',{D:1,L:1,observed:true},L('旁白','水珠顺着叶脉停在最低处。我转过一点叶尖，它便滑进土里。'),L('我','原来不一定要硬撑。我记住了这条小小的水路。'))
]),
C02:N('C02','名字从身边经过','lane','none',[
L('旁白','脚步声从小径那头来，又向远处去了。没有人蹲下来。'),L('我','别的花身边立着牌子。我翻来覆去看自己的叶子，什么也没写。'),L('旁白','墙边坐着一个歇脚的人。另一些没有牌子的草，正在石缝里伸出新叶。')
],'我的目光停在哪里？',[
O('朝有光的地方再伸高一点',{D:2,last:'D',noticed:true},L('旁白','我挺高叶尖。那人的影子经过，却没有停。'),L('我','原来再努力一点，也不保证马上被看见。可我真的很想被看见。')),
O('留意那个歇脚的人',{L:2,last:'L',quiet:true},L('旁白','那人把背篓放下，肩膀慢慢松开。我也不再急着晃动叶子。'),L('我','我不知道他为什么累。也许先安静一会儿，并不是什么坏事。')),
O('看看那些没有牌子的草',{D:1,L:1,unseen:true},L('旁白','石缝很窄，草叶却还在向外伸。没有脚步经过时，它们也没有停下。'),L('我','我先把这件事记下来。现在还说不出它的意思。'))
]),
C03:N('C03','两种声音','seed','both',[
L('映红','原来是你在叹气。我还以为雨又下回来了。'),L('我','你听得见？我……还没有名字。'),L('兰序','那先用“小芽”称呼你，好吗？如果不喜欢，我们再换。'),L('映红','我是映红，她是兰序。别急着开花，先说说你在想什么。')
],'先把哪个问题说出口？',[
O('问映红：我怕被风吹倒，你能教教我吗？',{D:2,last:'D'},L('映红','可以呀。先别一下子把叶子全展开，试着转一点方向，看看哪样更稳。'),L('旁白','我照她说的试了试。虽然还是有点晃，却没有刚才那么害怕了。'),L('兰序','等这阵风小一点，我再给你看相册。里面有花的照片，也有巴中的故事。')),
O('问兰序：相册里有哪些巴中的故事？',{L:2,last:'L'},L('兰序','有山上的杜鹃，也有红军医院里种兰花的故事。我可以慢慢讲给你听。'),L('旁白','她把相册放低，让我看得清楚。映红伸手扶住被风掀起的一页。'),L('映红','我们一起看。看完以后，你想试着站稳，我也陪你。')),
O('问她们：你们也有不知道该怎么办的时候吗？',{D:1,L:1,reflect:true},L('映红','当然有。我以前总想一个人把事情做好，累了也不肯求助，结果反而耽误了事。'),L('兰序','我也帮过倒忙。我以为别人需要安静，后来问了才知道，他其实想找人说说话。'),L('我','原来你们也会弄错，也要一点点学。'))
]),
C04:N('C04','把花看清','azalea','ying',[
L('旁白','册页上出现两张实物照片。我的根仍在土里，目光却像能跟着书页走远。'),L('映红','看我的花口：五个裂片，下面连在一起。上面那些深色小点，也别漏掉。'),L('兰序','春剑外面三枚是萼片，里面还有两枚花瓣和一枚特别的唇瓣。不能只数成“三片”。')
],'想把哪一处看得更清楚？',[
O('看杜鹃花冠与上部斑点',{D:2,last:'D',flowerD:true},L('旁白','映红把照片转向光亮处。我看见斑点集中在上部，花口向外张开。'),L('映红','山上也有别的杜鹃。别拿一整片花海，都当成同一种花。')),
O('看春剑的外萼片和中央唇瓣',{L:2,last:'L',flowerL:true},L('旁白','兰序换了一页。细长的外萼片展开，花心却收得很紧。'),L('兰序','它们各有位置。不是长得一样，才算一起开花。')),
O('对照花与它们身边的环境',{D:1,L:1,habitat:true},L('旁白','一张照片铺着满山花色，另一张的长叶从花序旁伸开。'),L('我','我不只看花了。光、土壤和水，好像也在照片里。'))
],'botany'),
C05:N('C05','风没有停','seed','both',[
L('旁白','书页合上。一阵更强的风，把我的叶片压向地面。身旁的小芽几乎贴在土上。'),L('映红','别急着证明什么，先感觉一下根在哪里。'),L('兰序','我在这里。你可以告诉我们，你需要什么。')
],'我怎样应对这阵风？',[
O('立即重新撑起叶片',{D:2,last:'D',tried:true},L('旁白','我用力站起，却被下一阵风推了回来。这一回，我慢慢找到较稳的位置。'),L('映红','再来一次不丢脸。你已经知道哪一步太急了。')),
O('先护住旁边那株小芽',{L:2,last:'L',protected:true},L('旁白','我偏过叶片替它挡住一小股风，自己的叶尖也开始发酸。'),L('兰序','它缓过来了。现在换个位置，让你也歇一会儿。')),
O('沿着风的方向调整叶片',{D:1,L:1,adapted:true},L('旁白','我不再迎面顶住所有的风。转过一个角度，身上的力一下轻了。'),L('我','先前观察过的水路，让我想起：方向也许可以改变。'))
]),
C06:N('C06','被叫作市花以前','town','both',[
L('我','你们的名字，是谁取的？'),L('兰序','我们是故事里的化身。真正的市花，是巴中在2021年9月23日一同发布的杜鹃和兰花。'),L('映红','不是谁先开得漂亮，就自己戴上市花的牌子。城市的山水、记忆，还有许多人的参与，都在里面。'),L('旁白','册页映出恩阳的街巷。我的根留在原地，这座城却离我近了一点。')
],'夜色来临前，我还想追问……',[
O('明明害怕，为什么还往前走？',{D:3,last:'D'},L('映红','那我们就从害怕的地方说起。先不用答应成为谁。'),L('旁白','她翻到夹着红色书签的一页。山脊从纸上展开。')),
O('一件很小的关心，真的有分量吗？',{L:3,last:'L'},L('兰序','有时要先问：对谁有分量。我们去看一段和照护有关的记录。'),L('旁白','她翻到浅绿色书签。照片中的院落，安静地亮起来。')),
O('成为市花，能代表一座城的全部吗？',{D:1,L:1,city:true},L('映红','当然不能。一朵花，再热闹也装不下所有人。'),L('兰序','它像一个让人继续了解城市的入口。剩下的，需要你慢慢看。'),L('旁白','我想起今天最放不下的问题。书页顺着那个念头，停在新的地方。'))
],'city'),
D01:N('D01','在山风里','ridge','ying',[
L('旁白','书页里的光雾山铺向远处。映红没有把我带离土壤，只让我看见山上的风。'),L('映红','你问我为什么往前走。先试着站一站，再说答案。'),L('我','我还这么小，站得稳吗？')
],'面对她的邀请……',[
O('立刻迎风展开两片叶',{eager:true},L('旁白','我一下展开叶片。风像一只大手，压得我几乎说不出话。'),L('映红','慢点！我让你试，不是让你把退路也一起扔掉。')),

O('暂时不试，先看她示范',{watched:true},L('映红','行。你看我也会顺着风转身。'),L('旁白','她没有因为我退缩就收起邀请。我记下那个转身，准备下一次再试。'))
]),
D02:N('D02','不是每一朵都显眼','mountain','ying',[
L('我','这么多花，人们能分清每一朵吗？'),L('映红','未必。你先告诉我，自己看见了什么。'),L('旁白','照片里有向阳处的花团，也有藏在叶后的小花。远处的山色，连成一片。')
],'目光先停在……',[

]),

endingFor=function(r){
 const f=r.flags||{};
 const breadth=keys=>new Set(keys.map(k=>f[k]).filter(Boolean)).size;
 if(r.route==='D')return f.dHistory&&f.dAlbum&&f.dNext&&f.dClosing&&breadth(['dAlbum','dNext','dClosing'])>=2?'Dgood':'Dgrow';
 if(r.route==='L')return f.lHospital&&f.lPractice&&f.lAnswer&&f.lReceiving&&breadth(['lPractice','lAnswer','lReceiving'])>=2?'Lgood':'Lgrow';
 return breadth(['hStart','hLook','hCity','hAction','hMeaning'])>=3?'Hgood':'Hgrow';
};
})();

const SOURCES={city:['四川在线：巴中城市形象标识和市树、市花正式公布（2021-09-23）','https://sichuan.scol.com.cn/ggxw/202109/58289802.html'],mountain:['四川在线：光雾山高山杜鹃与当季赏花景观（2024-04-22）','https://bazhong.scol.com.cn/jtlvx/202404/82513032.html'],climate:['中国天气网：巴中气候背景','https://www.weather.com.cn/cityintro/101270901.shtml'],azalea:['植物智：杜鹃花 Rhododendron simsii','https://www.iplant.cn/fsz/info/Rhododendron%20simsii'],orchid:['Kew POWO：Cymbidium tortisepalum var. longibracteatum','https://powo.science.kew.org/taxon/urn%3Alsid%3Aipni.org%3Anames%3A20012164-1'],flora:['《中国植物志》18卷224页：春剑','https://www.iplant.cn/frps/pdf/18/224.pdf'],hospital:['通江县政府：川陕革命根据地红军烈士陵园与医院旧址群','https://tjxzf.gov.cn/zjtj/tjtz/7744011.html'],care:['人民网：红军老医院，有了新村医（2026-09-06）','https://sc.people.com.cn/n2/2026/0906/c345510-41688185.html']};

const cite=(...ids)=>ids.map(k=>`<a href="${SOURCES[k][1]}" target="_blank" rel="noopener noreferrer">${esc(SOURCES[k][0])}</a>`).join('；');
let archiveTab='city';
function archiveBody(tab){archiveTab=tab;let h=`<div class="tabs">${[['city','一城双花'],['botany','把花看清'],['hospital','战地兰香'],['memory','花与城市'],['sources','资料出处']].map(([id,t])=>`<button data-tab="${id}" class="${tab===id?'active':''}">${t}</button>`).join('')}</div>`;
if(tab==='city')h+=`<h3>同一天，被一座城记住</h3><div class="timeline"><p><strong>2021年5月28日 · 启动征集</strong>巴中市精神文明建设办公室发布城市精神表述语、城市形象及旅游宣传语和市树市花名称征集公告。</p><p><strong>公众参与与专家讨论</strong>线上线下公众参与，专家组开展10余次讨论。报道所称“逾90万票”属于整项征集活动，不能写成市花单项票数。</p><p><strong>2021年9月23日 · 正式发布</strong>杜鹃（映山红）、兰花（巴山春剑）同时被公布为巴中双市花。没有将其中一种写成后来增补的依据。</p></div><p class="note">出处：${cite('city')}</p><h3>为什么选择这两种花？</h3><p>发布报道从地方植物资源与文化记忆作解释：杜鹃在巴中分布广，与革命老区的红色记忆呼应；巴中盛产兰花，巴山春剑有地方代表性，王坪医院种兰的故事又让兰花连到坚贞与照护的记忆。</p><p>本作品的分析是：双市花让不同植物形态与城市经验并置，形成互补表达。这是基于资料的设计解读，并非已查到的“必须设双花”的独立官方决议理由；两种花也不应被硬分成只有一方才有的品格。</p><h3>山水，为花留下生长的位置</h3><p>巴中位于四川盆地东北部、米仓山南麓，地形复杂，气候湿润、降水较丰沛。多样的海拔与环境，为理解当地植物资源提供背景；不能仅凭气候相近，就断言某株照片中的花原生于巴中。</p><p class="note">环境来源：${cite('climate','mountain')}</p>`;
if(tab==='botany')h+=`<div class="fact-grid"><section><img class="fact-photo" data-photo="azalea" src="${ASSETS.azalea}" alt="映山红实物照片"><h3>${icon('ying')} 杜鹃 · 映山红</h3><p><i>Rhododendron simsii</i>。典型花冠为阔漏斗形，五个裂片基部合生，上部常见深色斑点，典型雄蕊10枚。并不是五片彼此独立的花瓣拼在一起。</p><p>光雾山的杜鹃景观包含多种杜鹃；花海照片可说明景观，不能将整片花海直接鉴定为映山红。</p><p class="note">${cite('azalea','mountain')}</p></section><section><img class="fact-photo" data-photo="orchid2" src="${ASSETS.orchid2}" alt="春剑栽培实物照片"><h3>${icon('lan')} 兰花 · 巴山春剑</h3><p>春剑可见现用组合 <i>Cymbidium tortisepalum var. longibracteatum</i>，旧资料也使用不同学名组合。典型花被外轮为3枚萼片；内轮为两枚普通花瓣，以及一枚特化的唇瓣，不能说只有三片花被。</p><p>外萼片较醒目，内花瓣靠近花心，唇瓣常有纹斑；花色与瓣型有品种差异。“巴山春剑”不能被理解为某一张商品照片中的唯一品种。</p><p class="note">${cite('orchid','flora')}</p></section></div><p class="note">两张照片为异地栽培/植物观察材料，不标为巴中野外实拍。姓名旁小花为简化身份图标，不能代替植物结构图。</p>`;
if(tab==='hospital')h+=`<img class="fact-photo" data-photo="hospital" src="${ASSETS.hospital}" alt="当代王坪红军医院旧址群"><h3>清馨，是艰难生活里的一点照护</h3><p>市花发布报道转述：张琴秋和女战士将兰花带到伤病员身边，并在医院周围栽种，以改善休养氛围。这里的意义是照护与精神慰藉，不能把花香写成治伤的药物。</p><p>现有资料不能确定故事中每株兰花的物种或栽培品种，也没有提供当年种兰的现场照片。本页采用当代旧址照；小说中的对白、幼芽与花的化身均为创作。</p><p class="note">${cite('city','hospital')}</p><h3>记忆也在今天继续</h3><p>2026年人民网走访王坪，把老医院的革命医疗记忆与今天的村医联系起来。作品据此思考：关怀不仅留在往事里，也在今天具体的生活中延续。</p><p class="note">${cite('care')}</p>`;
if(tab==='memory')h+=`<h3>热烈与清芬，都是城市记忆的入口</h3><p>市花发布报道将杜鹃与红色文化、耕耘和奉献相联系，也赋予兰花坚贞、刚毅的品格。映红从鲜亮的山花引出地方与红色记忆；兰序从春剑形态讲到战地照护。角色对白是创作，文化解释有来源，两者各自标明。</p><p class="note">${cite('city')}</p><div class="fact-grid"><section><img class="fact-photo" data-photo="flowerCamera" src="${ASSETS.flowerCamera}" alt="游客在光雾山拍摄杜鹃"><h3>山花，进入今天的生活</h3><p>光雾山游客与杜鹃同框的照片，把花和赏花、摄影、登山联系起来。花不只是被裁下的一块颜色，也在具体的地方景观与生活中被认识。</p><p>不同海拔和杜鹃种类的花期有差异，实际赏花时间也受天气影响。</p><p class="note">${cite('flowerLife','mountain')}</p></section><section><img class="fact-photo" data-photo="orchidCulture" src="${ASSETS.orchidCulture}" alt="成都兰展上的傅华龙与来自巴中的春剑玉海棠"><h3>来自巴中的春剑，走进兰展</h3><p>2024年红星新闻介绍成都杜甫草堂兰展时，记述傅华龙与春剑“玉海棠”，并指出该品种来自巴中。这是地方兰花资源进入当代兰文化交流的一个例子。</p><p>照片拍摄于成都兰展，不能写作巴中当地展览，也不能把这一品种当成所有巴山春剑的唯一花形。</p><p class="note">${cite('orchidCulture')}</p></section></div><h3>我为什么开花？</h3><p>市花的代表性不是给所有花排名。故事让小芽从认清花形、追问市花设立，到走近两段城市记忆，再理解自己的生长：可以期待被看见，也能与人相遇，不必先获得称号才有价值。草籽开成不同花形是童话设定。</p>`;
if(tab==='sources')h+=`<div class="sourcelist"><h3>资料来源</h3>${Object.keys(SOURCES).map(k=>`<p>${cite(k)}</p>`).join('')}<h3>事实与创作的边界</h3><p>调研整理截至2026年10月18日。来源链接需要联网打开；正文和全部采用图片已嵌入本文件。历史人物没有被安排说虚构引语；无法证实的具体日期、当年兰花品种等不作断言。</p><p>为什么采用双花的互补分析、角色品格、对话及情节是作者的设计解释。AI辅助插画与真实摄影分别标注，不能混为实景材料。</p><button class="plain-button" data-action="gallery">查看逐张照片出处</button></div>`;return h;}

if(kind==='archive'){title='走近巴中双市花';body=archiveBody(arg||'city');}

if(kind==='settings'){title='阅读设置';body=`<div class="settings-row"><label for="size-input">文字大小</label><input id="size-input" type="range" min="15" max="24" value="${db.settings.size}"><span id="size-value">${db.settings.size}px</span></div><div class="settings-row"><label for="speed-input">逐字间隔</label><input id="speed-input" type="range" min="0" max="65" value="${db.settings.speed}"><span id="speed-value">${db.settings.speed===0?'即时':db.settings.speed+'ms'}</span></div><div class="settings-row"><label for="theme-input">框体色调</label><select id="theme-input"><option value="scene">随场景调整</option><option value="cool">浅冷灰</option><option value="warm">浅暖灰</option><option value="dark">深灰</option></select></div><div class="settings-row"><label for="motion-input">逐字与过渡</label><input id="motion-input" type="checkbox" ${db.settings.motion?'checked':''}></div><p class="note">文字本身保持实色，半透明底色衬托照片。尊重系统减少动态效果偏好。没有音频，不会自动播放声音。</p><button class="plain-button" data-action="export">导出花信</button>`;}
if(kind==='about'){title='一粒草籽的花信';body=`<p class="intro-notice">这是关于巴中双市花的原创互动童话。背景使用真实摄影；映红与兰序为AI辅助设计的拟人插画。草籽能够开成不同花形，是故事规则。</p><h3>怎样阅读</h3><p>点击对话或按空格、右方向键继续。逐字显示时，第一次点击显示整句，第二次继续。每个普通周目有15次三选一，共通篇根据一路的选择带你走近相应市花。前面的经历也会改变后续事件与结局。</p><p>先在两条路线分别读到最佳结局《向山而开》《为你留香》，首页才会出现“循着两段记忆”。隐藏故事有6次专属选择。若想重读另一条市花线，仍可使用“开始故事”。</p><p>“已读快进”只越过此前读过的对白，遇到新内容和选项会停止。随时打开市花档案，不必通关才能查阅调研内容。</p><h3>关于记录</h3><p>进度保存在当前浏览器。换浏览器、清理浏览数据或移动文件后，本地存储可能不同；可以用存读档中的导出、导入保留花信。开始新周目不清除已收录结局。</p><h3>制作说明</h3><p>AI辅助完成角色试稿、透明立绘、程序与文字整理；资料经来源核对，人物对白为原创。姓名旁映山红与春剑图标使用简约矢量线形。作品不将传说、现代照片或虚构对白当成历史现场证据。</p><p class="note">本页为在线分享版，首次打开需联网加载图片。进度保存在当前设备的浏览器；更换设备可在“存读档”中导出、导入花信。另有内嵌全部素材的单文件HTML用于课程提交。摄影素材复用条件见照片册。</p><button class="plain-button" data-action="sources">查看研究出处</button>`;}
$('modal-title').textContent=title;$('modal-body').innerHTML=body;bindModal();$('close').focus();if(kind==='tip')$('tip-more').onclick=()=>openModal('archive',arg.tips.source||'city');if(kind==='settings'){$('theme-input').value=db.settings.theme;for(const [id,key]of [['size-input','size'],['speed-input','speed']])$(id).oninput=()=>{db.settings[key]=Number($(id).value);$(key+'-value').textContent=key==='size'?db.settings.size+'px':db.settings.speed===0?'即时':db.settings.speed+'ms';applySettings();persist();};$('theme-input').onchange=()=>{db.settings.theme=$('theme-input').value;applySettings();persist();};$('motion-input').onchange=()=>{db.settings.motion=$('motion-input').checked;applySettings();persist();};}}
function bindModal(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ $('modal-body').innerHTML=archiveBody(b.dataset.tab);bindModal();});document.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>zoomPhoto(b.dataset.photo));document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{if(!run)return;const i=+b.dataset.save;if(db.slots[i]&&!confirm('覆盖这封手动花信？'))return;run.savedAt=new Date().toISOString();db.slots[i]=clone(run);persist();openModal('saves');toast('已写入花信 '+(i+1));});document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{run=clone(db.slots[+b.dataset.load]);closeModal();enterGame();checkpoint();});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='export')exportData();if(a==='import')importData();if(a==='gallery')openModal('gallery');if(a==='sources')openModal('archive','sources');});}
function zoomPhoto(id){const p=photo(id);$('modal-title').textContent=p.title;$('modal-body').innerHTML=`<img class="zoom" src="${ASSETS[id]}" alt="${esc(p.title)}"><p class="note">${esc(p.credit)} · <a href="${esc(p.source)}" target="_blank" rel="noopener noreferrer">查看原始出处 ↗</a></p><button id="back-gallery" class="plain-button">返回照片册</button>`;$('back-gallery').onclick=()=>openModal('gallery');}
function closeModal(){$('overlay').hidden=true;if(run&&$('game').hidden===false&&run.phase!=='end'){if(currentLine)$('line').textContent=currentLine.text;queueAuto();}lastFocus?.focus?.();}
function exportData(){checkpoint();const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='花开有时_花信备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('花信备份已导出');}
function importData(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{const file=input.files[0];if(!file)return;if(file.size>3000000){toast('文件过大，请选择花信备份文件');return;}try{const next=sanitizeDB(JSON.parse(await file.text()));if(!next)throw Error();if(!confirm('用备份中的进度替换当前记录？建议先导出当前花信。'))return;db=next;run=null;persist();applySettings();closeModal();goHome();toast('已导入花信');}catch(e){toast('没有读到有效花信，当前进度未改变');}};input.click();}
function applySettings(){document.documentElement.style.setProperty('--body-size',db.settings.size+'px');document.documentElement.style.setProperty('--text-scale',String(db.settings.size/18));document.body.classList.toggle('no-motion',!db.settings.motion||matchMedia('(prefers-reduced-motion: reduce)').matches);setBg(activeBg);}
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openModal(b.dataset.open));$('close').onclick=closeModal;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal();};$('start').onclick=()=>{if(db.autosave&&!db.autosave.completed&&!confirm('开始新周目会替换自动记录，已收藏结局和手动花信会保留。继续吗？'))return;start();};$('hidden-start').onclick=()=>{if(db.autosave&&!db.autosave.completed&&!confirm('开启新的花信会替换自动记录，手动花信与收藏会保留。继续吗？'))return;start(true);};$('continue').onclick=()=>{if(db.autosave){run=clone(db.autosave);enterGame();}};$('home-button').onclick=goHome;$('advance').onclick=advance;$('line').onclick=advance;$('auto').onclick=()=>{autoMode=!autoMode;skipMode=false;controls();if(autoMode){if(typing){clearInterval(typing);typing=null;$('line').textContent=currentLine.text;}queueAuto();}else clearTimeout(autoTimer);};$('skip').onclick=()=>{skipMode=!skipMode;autoMode=false;controls();if(skipMode){if(!shownBefore){skipMode=false;controls();toast('已到达未读内容');return;}if(typing){clearInterval(typing);typing=null;$('line').textContent=currentLine.text;}queueAuto();}else clearTimeout(autoTimer);};$('hide-ui').onclick=()=>document.body.classList.add('hide-ui');$('unhide').onclick=()=>document.body.classList.remove('hide-ui');
document.addEventListener('keydown',e=>{if(!$('overlay').hidden){if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){const els=Array.from($('overlay').querySelectorAll('button,a,input,select')).filter(x=>!x.disabled&&!x.hidden);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}return;}if(e.key==='Escape'){document.body.classList.remove('hide-ui');if(!$('game').hidden)openModal('settings');return;}if(!run||$('game').hidden)return;if((e.key===' '||e.key==='ArrowRight')&&!['BUTTON','INPUT','SELECT','A'].includes(document.activeElement.tagName)){e.preventDefault();advance();}});
applySettings();goHome();

$('fullscreen').onclick=async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();try{await screen.orientation?.lock?.('landscape');}catch(e){}}else await document.exitFullscreen();}catch(e){toast('浏览器未启用全屏，可将设备横过来阅读');}};
</script></body></html>
